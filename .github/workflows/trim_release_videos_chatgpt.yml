name: Trim release demo videos

on:
  push:
    paths:
      - '.github/workflows/trim_release_videos_chatgpt.yml'

permissions:
  contents: read

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source videos
        run: |
          curl -L --fail --retry 3 -o dub_english.mp4 \
            'https://github.com/MASELKO-95/ViDubb_Pro_MasloEdition/releases/download/Media/dub_english.mp4'
          curl -L --fail --retry 3 -o dub_japanese.mp4 \
            'https://github.com/MASELKO-95/ViDubb_Pro_MasloEdition/releases/download/Media/dub_japanese.mp4'

      - name: Create sub-10MB demo clips
        run: |
          mkdir -p output

          make_clip() {
            input="$1"
            output="$2"

            ffmpeg -y -ss 10 -i "$input" -t 20 \
              -c:v libx264 -preset medium -b:v 3500k -maxrate 3500k -bufsize 7000k \
              -c:a aac -b:a 128k -movflags +faststart "$output"

            size=$(stat -c%s "$output")
            if [ "$size" -ge 10000000 ]; then
              ffmpeg -y -ss 10 -i "$input" -t 20 \
                -c:v libx264 -preset medium -b:v 3000k -maxrate 3000k -bufsize 6000k \
                -c:a aac -b:a 112k -movflags +faststart "$output"
            fi
          }

          make_clip dub_english.mp4 output/dub_english_10mb.mp4
          make_clip dub_japanese.mp4 output/dub_japanese_10mb.mp4

          ls -lh output
          test $(stat -c%s output/dub_english_10mb.mp4) -lt 10000000
          test $(stat -c%s output/dub_japanese_10mb.mp4) -lt 10000000

      - name: Upload trimmed clips
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-demo-videos
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
